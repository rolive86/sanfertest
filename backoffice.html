<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Back Office — Test de Manejo | San Fernando</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/sanfer-isotipo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ── LIGHT MODE — San Fernando Municipio (fondo blanco, azul + naranja) ── */
:root{
  --bg:       #ffffff;
  --bg2:      #ffffff;
  --bg3:      #f3f8fc;
  --border:   #e2eaf2;
  --border2:  #c5d4e4;
  --text:     #181008;
  --text2:    #4a5568;
  --text3:    #7a8494;
  --accent:   #0088C8;
  --accent2:  #2868A8;
  --orange:   #E89000;
  --green:    #00a844;
  --red:      #d62b4a;
  --yellow:   #E89000;
  --r:        10px;
  --r-sm:     6px;
  --topbar-bg:#ffffff;
  --topbar-fg:#2868A8;
  --topbar-sub:#5a6a80;
  --topbar-pill-bg:#eef5fa;
  --topbar-pill-border:#d4e2ee;
  --topbar-pill-fg:#4a5568;
}

/* ── DARK MODE (opcional) ── */
[data-theme="dark"]{
  --bg:       #0f1117;
  --bg2:      #171923;
  --bg3:      #1e2130;
  --border:   #2a2f45;
  --border2:  #3a405a;
  --text:     #e8eaf0;
  --text2:    #8b91a8;
  --text3:    #5a6080;
  --accent:   #40A0D8;
  --accent2:  #9dc8ff;
  --green:    #00c853;
  --red:      #ff3b5c;
  --yellow:   #E89000;
  --orange:   #E09030;
  --topbar-bg:#12151f;
  --topbar-fg:#ffffff;
  --topbar-sub:rgba(255,255,255,.65);
  --topbar-pill-bg:rgba(255,255,255,.1);
  --topbar-pill-border:rgba(255,255,255,.22);
  --topbar-pill-fg:rgba(255,255,255,.88);
}
html,body{height:100%}
html{font-size:15px}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  transition:background .3s,color .3s;
}

/* ── TOPBAR ── */
.topbar{
  background:var(--topbar-bg);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:sticky;top:0;z-index:50;
  transition:background .3s;
}
.topbar-logo{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:15px;color:var(--topbar-fg);
  letter-spacing:-.3px;
}
.topbar-sub{font-size:10px;color:var(--topbar-sub);font-weight:400;line-height:1.2}
.topbar-logo-img{height:40px;width:auto;margin-right:4px;display:block}
.theme-toggle{
  background:transparent;border:1px solid var(--topbar-pill-border);
  color:var(--topbar-pill-fg);border-radius:20px;
  padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600;
  font-family:'DM Sans',sans-serif;transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.topbar-logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
}
.topbar-stats{
  display:flex;align-items:center;gap:16px;
}
.stat-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--topbar-pill-bg);
  border:1px solid var(--topbar-pill-border);
  border-radius:100px;
  padding:4px 12px;
  font-size:12px;font-weight:600;color:var(--topbar-pill-fg);
}
.stat-pill span{color:var(--accent);font-family:'DM Mono',monospace}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:260px;flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sidebar-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.search-wrap{position:relative}
.search-input{
  width:100%;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:8px 10px 8px 32px;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  outline:none;
}
.search-input:focus{border-color:var(--accent)}
.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:13px;pointer-events:none;
}
.filter-row{
  display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;
}
.filter-chip{
  padding:3px 9px;border-radius:100px;
  font-size:11px;font-weight:600;cursor:pointer;
  border:1px solid var(--border2);
  background:transparent;color:var(--text3);
  transition:all .15s;white-space:nowrap;
}
.filter-chip:hover{border-color:var(--accent);color:var(--accent)}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

.sidebar-list{
  flex:1;overflow-y:auto;
  padding:8px;
}
.sidebar-list::-webkit-scrollbar{width:4px}
.sidebar-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.q-item{
  padding:10px 12px;
  border-radius:var(--r-sm);
  cursor:pointer;
  margin-bottom:2px;
  border:1px solid transparent;
  transition:all .15s;
}
.q-item:hover{background:var(--bg3)}
.q-item.active{background:var(--bg3);border-color:var(--accent)}
.q-item-num{
  font-family:'DM Mono',monospace;
  font-size:10px;color:var(--text3);
  margin-bottom:3px;
}
.q-item-text{
  font-size:12px;color:var(--text2);
  line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.q-item-cat{
  display:inline-block;margin-top:4px;
  font-size:10px;font-weight:600;
  padding:2px 6px;border-radius:3px;
  background:var(--bg);color:var(--text3);
}
.q-item.has-img .q-item-num::after{content:' 🖼';font-size:9px}

/* ── MAIN EDITOR ── */
.editor{
  flex:1;overflow-y:auto;
  padding:28px 32px;
}
.editor::-webkit-scrollbar{width:6px}
.editor::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.editor-empty{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--text3);gap:12px;
}
.editor-empty-icon{font-size:48px;opacity:.3}
.editor-empty-txt{font-size:14px}

.editor-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:24px;gap:16px;
}
.editor-id{
  font-family:'DM Mono',monospace;font-size:11px;
  color:var(--text3);margin-bottom:4px;
}
.editor-title{
  font-size:18px;font-weight:700;color:var(--text);
  letter-spacing:-.3px;
}
.btn-group{display:flex;gap:8px}
.btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:var(--r-sm);
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid transparent;
  transition:all .15s;
  white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#0088d4;border-color:#0088d4}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border2)}
.btn-ghost:hover{border-color:var(--text2);color:var(--text)}
.btn-add{background:var(--green);color:#000;border-color:var(--green)}
.btn-add:hover{background:#00e676}

/* Form fields */
.field{margin-bottom:20px}
.field-label{
  display:block;
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;
  color:var(--text3);margin-bottom:8px;
}
.field-input,.field-textarea,.field-select{
  width:100%;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:10px 12px;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  outline:none;
  transition:border-color .15s;
}
.field-input:focus,.field-textarea:focus,.field-select:focus{
  border-color:var(--accent);
}
.field-textarea{min-height:80px;resize:vertical;line-height:1.5}
.field-select option{background:var(--bg2)}

/* Options editor */
.opts-editor{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.opt-row{
  display:flex;align-items:center;gap:8px;
}
.opt-letter{
  width:28px;height:28px;flex-shrink:0;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:11px;font-weight:700;
  border:2px solid var(--border2);color:var(--text3);
  background:var(--bg3);cursor:pointer;
  transition:all .15s;
}
.opt-letter.correct{
  background:var(--green);border-color:var(--green);color:#000;
}
.opt-letter:hover:not(.correct){border-color:var(--green);color:var(--green)}
.opt-input{
  flex:1;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:8px 12px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;transition:border-color .15s;
}
.opt-input:focus{border-color:var(--accent)}
.opt-row.correct-row .opt-input{
  border-color:var(--green);background:rgba(0,200,83,.07);
}
.opt-drag{
  color:var(--text3);cursor:grab;padding:4px;font-size:14px;
}
.opt-drag:hover{color:var(--text2)}
.opt-remove{
  width:24px;height:24px;border-radius:4px;
  background:transparent;border:none;
  color:var(--text3);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.opt-remove:hover{background:rgba(255,59,92,.2);color:var(--red)}

/* Image section */
.img-section{
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:20px;
  background:var(--bg2);
}
.img-preview-wrap{
  display:flex;align-items:flex-start;gap:16px;
}
.img-preview{
  width:120px;height:120px;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  object-fit:contain;background:var(--bg3);
  flex-shrink:0;
}
.img-preview.empty{
  display:flex;align-items:center;justify-content:center;
  color:var(--text3);font-size:28px;
}
.img-controls{flex:1;display:flex;flex-direction:column;gap:8px}
.img-url-row{display:flex;gap:6px}
.img-url-input{flex:1}
.img-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;
  background:rgba(0,136,200,.12);color:var(--accent);border:1px solid rgba(0,136,200,.28);
}

/* Cat badge colors */
.cat-badge{
  display:inline-block;padding:3px 8px;border-radius:4px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
}


/* Sign picker */
.sign-picker-modal{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.8);
  display:none;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;
}
.sign-picker-modal.show{display:flex}
.sign-picker-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:14px;
  width:100%;max-width:860px;
  padding:24px;
}
.sign-picker-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.sign-picker-title{font-weight:700;font-size:15px}
.sign-picker-search{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:6px;padding:7px 12px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;width:200px;
}
.sign-picker-search:focus{border-color:var(--accent)}
.sign-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:8px;
  max-height:520px;overflow-y:auto;
  padding-right:4px;
}
.sign-grid::-webkit-scrollbar{width:4px}
.sign-grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sign-thumb{
  background:var(--bg3);
  border:2px solid var(--border);
  border-radius:8px;
  padding:8px;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all .15s;
}
.sign-thumb:hover{border-color:var(--accent);background:rgba(0,136,200,.08)}
.sign-thumb.selected{border-color:var(--green);background:rgba(0,200,83,.1)}
.sign-thumb img{
  width:64px;height:64px;
  object-fit:contain;
  background:#fff;
  border-radius:4px;
  padding:4px;
}
.sign-thumb-name{
  font-family:'DM Mono',monospace;
  font-size:9px;color:var(--text3);
  text-align:center;word-break:break-all;
  line-height:1.3;
}
.sign-picker-actions{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:16px;padding-top:16px;
  border-top:1px solid var(--border);
}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--green);color:#000;
  padding:12px 20px;border-radius:var(--r);
  font-weight:700;font-size:13px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  animation:toastIn .3s ease;pointer-events:none;
}
.toast.error{background:var(--red);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Divider */
.divider{height:1px;background:var(--border);margin:24px 0}

/* Export section */
.export-section{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:20px;
  margin-top:32px;
}
.export-title{font-weight:700;margin-bottom:12px;font-size:14px}
.export-textarea{
  width:100%;height:200px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:12px;color:var(--accent);
  font-family:'DM Mono',monospace;font-size:11px;
  resize:vertical;outline:none;
  line-height:1.6;
}

/* Reorder handle */
.reorder-hint{
  font-size:11px;color:var(--text3);
  margin-top:4px;
}

/* Add question panel */
.add-panel{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;
  padding:24px;
}
.add-panel.show{display:flex}
.add-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:28px;
  width:100%;max-width:600px;
  max-height:90vh;overflow-y:auto;
}
.add-card-title{
  font-size:16px;font-weight:700;margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:center;
}

/* Responsive */
@media(max-width:768px){
  .sidebar{width:200px}
  .editor{padding:16px}
}
</style>
</head>
<body>

<!-- TOAST -->
<div id="toast" class="toast" style="display:none"></div>


<!-- SIGN PICKER MODAL -->
<div class="sign-picker-modal" id="signPickerModal">
  <div class="sign-picker-card">
    <div class="sign-picker-header">
      <span class="sign-picker-title">🖼️ Seleccionar señal del repositorio</span>
      <div style="display:flex;gap:10px;align-items:center">
        <input class="sign-picker-search" id="signSearch" placeholder="Buscar señal..." oninput="filterSigns()">
        <button class="btn btn-ghost" onclick="closeSignPicker()" style="padding:6px 12px">✕</button>
      </div>
    </div>
    <div class="sign-grid" id="signGrid"></div>
    <div class="sign-picker-actions">
      <button class="btn btn-ghost" onclick="closeSignPicker()">Cancelar</button>
      <button class="btn btn-primary" id="signPickerConfirm" onclick="confirmSignPicker()" disabled>✓ Usar esta señal</button>
    </div>
  </div>
</div>

<!-- ADD QUESTION PANEL -->
<div class="add-panel" id="addPanel">
  <div class="add-card">
    <div class="add-card-title">
      <span>➕ Nueva pregunta</span>
      <button class="btn btn-ghost" onclick="closeAddPanel()">✕ Cerrar</button>
    </div>
    <div class="field">
      <label class="field-label">Categoría</label>
      <select class="field-select" id="new-cat"></select>
    </div>
    <div class="field">
      <label class="field-label">Imagen (opcional)</label>
      <div style="display:flex;gap:6px">
        <input class="field-input" id="new-img" placeholder="URL o elegir del repositorio" style="flex:1">
        <button class="btn btn-ghost" onclick="openSignPicker(true)" style="white-space:nowrap;padding:0 12px">🖼️ Repositorio</button>
      </div>
    </div>
    <div class="field">
      <label class="field-label">Pregunta</label>
      <textarea class="field-textarea" id="new-q" placeholder="¿Cuál es...?"></textarea>
    </div>
    <div class="field">
      <label class="field-label">Opciones (A–D) — click en la letra para marcar correcta</label>
      <div id="new-opts" class="opts-editor">
        <div class="opt-row" data-idx="0"><span class="opt-letter" onclick="setNewCorrect(0)">A</span><input class="opt-input" placeholder="Opción A"></div>
        <div class="opt-row" data-idx="1"><span class="opt-letter" onclick="setNewCorrect(1)">B</span><input class="opt-input" placeholder="Opción B"></div>
        <div class="opt-row" data-idx="2"><span class="opt-letter" onclick="setNewCorrect(2)">C</span><input class="opt-input" placeholder="Opción C"></div>
        <div class="opt-row" data-idx="3"><span class="opt-letter" onclick="setNewCorrect(3)">D</span><input class="opt-input" placeholder="Opción D"></div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">Explicación</label>
      <textarea class="field-textarea" id="new-exp" placeholder="La respuesta correcta es..."></textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeAddPanel()">Cancelar</button>
      <button class="btn btn-add" onclick="saveNewQuestion()">✓ Agregar pregunta</button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <img id="bo-logo" class="topbar-logo-img" src="assets/sanfer-horizontal.png" alt="San Fernando Municipio">
    <div>
      <div style="font-size:13px;font-weight:700;line-height:1.2">Back Office — Test de Manejo</div>
      <div class="topbar-sub">San Fernando Municipio</div>
    </div>
  </div>
  <div class="topbar-stats">
    <div class="stat-pill">Preguntas: <span id="stat-total">0</span></div>
    <div class="stat-pill">Con imagen: <span id="stat-img">0</span></div>
    <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙 Modo oscuro</button>
    <button class="btn btn-add" onclick="showAddPanel()" style="padding:6px 14px;font-size:12px">+ Nueva</button>
    <button class="btn btn-primary" onclick="exportBank()" style="padding:6px 14px;font-size:12px">⬇ Exportar</button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" placeholder="Buscar pregunta..." oninput="filterList()">
      </div>
      <div class="filter-row" id="filterRow"></div>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </div>

  <!-- EDITOR -->
  <div class="editor" id="editor">
    <div class="editor-empty">
      <div class="editor-empty-icon">📋</div>
      <div class="editor-empty-txt">Seleccioná una pregunta para editar</div>
    </div>
  </div>

</div>

<script>
// ── DATA ──
var BANK = [
  {
    "id": 1,
    "cat": "Licencia de conducir",
    "img": "",
    "q": "Qué certifica la Licencia Nacional de Conducir?",
    "opts": [
      "Qué el titular pago el impuesto automotor",
      "Qué esta habilitado para conducir determinado vehículo en la via publica",
      "Qué el vehículo paso la VTV",
      "Qué tiene seguro vigente"
    ],
    "a": 1,
    "exp": "La licencia certifica que la persona esta habilitada para conducir un vehículo especifico en la via publica, tras cumplir los requisitos correspondientes."
  },
  {
    "id": 2,
    "cat": "Licencia de conducir",
    "img": "",

var currentId = null;
var newCorrectIdx = 0;
var activeFilter = 'Todas';

// ── INIT ──
function init(){
  updateStats();
  buildFilterChips();
  renderList();
  // Populate new-cat select
  var cats = getCats();
  var sel = document.getElementById('new-cat');
  cats.forEach(function(c){
    var o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
  });
}

function getCats(){
  var cats = ['Todas'].concat([...new Set(BANK.map(function(q){return q.cat}))].sort());
  return cats;
}

function updateStats(){
  document.getElementById('stat-total').textContent = BANK.length;
  document.getElementById('stat-img').textContent = BANK.filter(function(q){return q.img}).length;
}

// ── FILTER CHIPS ──
function buildFilterChips(){
  var row = document.getElementById('filterRow');
  row.innerHTML = '';
  var cats = getCats();
  cats.forEach(function(cat){
    var chip = document.createElement('button');
    chip.className = 'filter-chip' + (cat === activeFilter ? ' active' : '');
    chip.textContent = cat === 'Todas' ? 'Todas' : cat.split(' ')[0];
    chip.title = cat;
    chip.onclick = function(){activeFilter=cat; buildFilterChips(); renderList();};
    row.appendChild(chip);
  });
}

// ── SIDEBAR LIST ──
function renderList(){
  var search = document.getElementById('searchInput').value.toLowerCase();
  var list = document.getElementById('sidebarList');
  list.innerHTML = '';
  
  BANK.forEach(function(q){
    if(activeFilter !== 'Todas' && q.cat !== activeFilter) return;
    if(search && !q.q.toLowerCase().includes(search) && !q.cat.toLowerCase().includes(search)) return;
    
    var item = document.createElement('div');
    item.className = 'q-item' + (q.id === currentId ? ' active' : '') + (q.img ? ' has-img' : '');
    item.innerHTML = '<div class="q-item-num">#' + q.id + '</div>' +
      '<div class="q-item-text">' + escHtml(q.q) + '</div>' +
      '<span class="q-item-cat">' + q.cat + '</span>';
    item.onclick = function(){editQuestion(q.id)};
    list.appendChild(item);
  });
}

function filterList(){ renderList(); }

// ── EDITOR ──
function editQuestion(id){
  currentId = id;
  var q = BANK.find(function(x){return x.id===id});
  if(!q) return;
  
  renderList(); // update active state
  
  var letters = ['A','B','C','D','E'];
  var catColor = getCatColor(q.cat);
  
  var html = '<div class="editor-header">' +
    '<div><div class="editor-id">#' + q.id + '</div>' +
    '<div class="editor-title">' + escHtml(q.q.substring(0,60)) + (q.q.length>60?'...':'') + '</div></div>' +
    '<div class="btn-group">' +
    '<button class="btn btn-danger" onclick="deleteQuestion(' + q.id + ')">🗑 Eliminar</button>' +
    '<button class="btn btn-primary" onclick="saveQuestion(' + q.id + ')">✓ Guardar</button>' +
    '</div></div>';
  
  // Category
  html += '<div class="field"><label class="field-label">Categoría</label>' +
    '<select class="field-select" id="edit-cat">';
  getCats().filter(function(c){return c!=='Todas'}).forEach(function(c){
    html += '<option value="' + escHtml(c) + '"' + (c===q.cat?' selected':'') + '>' + escHtml(c) + '</option>';
  });
  html += '</select></div>';
  
  // Question text
  html += '<div class="field"><label class="field-label">Pregunta</label>' +
    '<textarea class="field-textarea" id="edit-q" style="min-height:100px">' + escHtml(q.q) + '</textarea></div>';
  
  // Image
  html += '<div class="img-section">' +
    '<label class="field-label" style="margin-bottom:12px">Imagen de señal (opcional)</label>' +
    '<div class="img-preview-wrap">';
  
  if(q.img){
    html += '<img class="img-preview" id="img-preview-el" src="' + escHtml(q.img) + '" style="max-width:120px;max-height:120px;object-fit:contain" onerror="this.className+=\'err\'">';
  } else {
    html += '<div class="img-preview empty" id="img-preview-el">🖼️</div>';
  }
  
  html += '<div class="img-controls">' +
    '<div class="img-url-row">' +
    '<input class="field-input img-url-input" id="edit-img" placeholder="URL de imagen o vacío para sin imagen" ' +
    'value="' + escHtml(q.img||'') + '" oninput="previewImg()">' +
    '</div>' +
    (q.img ? '<div><span class="img-badge">🔗 GitHub</span></div>' : '') +
    '<div style="display:flex;gap:6px;margin-top:6px">' +
    '<button class="btn btn-ghost" onclick="openSignPicker(false)" style="font-size:12px;padding:6px 10px;flex:1">🖼️ Elegir del repositorio</button>' +
    '<button class="btn btn-ghost" onclick="clearImg()" style="font-size:12px;padding:6px 10px">✕ Quitar</button>' +
    '</div>' +
    '</div></div></div>';
  
  // Options
  html += '<div class="field"><label class="field-label">Opciones — clic en la letra para marcar la correcta</label>' +
    '<div class="opts-editor" id="edit-opts">';
  
  q.opts.forEach(function(opt, i){
    var isCorrect = i === q.a;
    html += '<div class="opt-row' + (isCorrect?' correct-row':'') + '" data-idx="' + i + '">' +
      '<span class="opt-letter' + (isCorrect?' correct':'') + '" onclick="setCorrect(' + id + ',' + i + ')">' + letters[i] + '</span>' +
      '<input class="opt-input" id="edit-opt-' + i + '" value="' + escHtml(opt) + '">' +
      '<button class="opt-remove" onclick="removeOpt(' + id + ',' + i + ')">✕</button>' +
      '</div>';
  });
  
  html += '</div>' +
    '<button class="btn btn-ghost" onclick="addOpt(' + id + ')" style="font-size:12px;margin-top:6px">+ Agregar opción</button>' +
    '<div class="reorder-hint">Arrastrá las opciones para reordenarlas (próximamente)</div>' +
    '</div>';
  
  // Explanation
  html += '<div class="field"><label class="field-label">Explicación (se muestra al responder)</label>' +
    '<textarea class="field-textarea" id="edit-exp" style="min-height:120px">' + escHtml(q.exp) + '</textarea></div>';
  
  // Action buttons bottom
  html += '<div style="display:flex;justify-content:flex-end;gap:8px;padding-top:8px">' +
    '<button class="btn btn-danger" onclick="deleteQuestion(' + id + ')">🗑 Eliminar pregunta</button>' +
    '<button class="btn btn-primary" onclick="saveQuestion(' + id + ')">✓ Guardar cambios</button>' +
    '</div>';

  document.getElementById('editor').innerHTML = html;
}

// ── SAVE ──
function saveQuestion(id){
  var q = BANK.find(function(x){return x.id===id});
  if(!q) return;
  
  q.cat  = document.getElementById('edit-cat').value;
  q.q    = document.getElementById('edit-q').value.trim();
  q.img  = document.getElementById('edit-img').value.trim();
  q.exp  = document.getElementById('edit-exp').value.trim();
  
  // Save opts
  var opts = [];
  document.querySelectorAll('#edit-opts .opt-input').forEach(function(inp){
    opts.push(inp.value.trim());
  });
  q.opts = opts;
  
  updateStats();
  renderList();
  showToast('✓ Pregunta #' + id + ' guardada');
}

// ── CORRECT ANSWER ──
function setCorrect(id, idx){
  var q = BANK.find(function(x){return x.id===id});
  if(!q) return;
  q.a = idx;
  
  // Update UI
  document.querySelectorAll('#edit-opts .opt-row').forEach(function(row, i){
    row.classList.toggle('correct-row', i===idx);
    row.querySelector('.opt-letter').classList.toggle('correct', i===idx);
  });
  showToast('✓ Respuesta correcta: opción ' + ['A','B','C','D'][idx]);
}

// ── OPTIONS ──
function addOpt(id){
  var q = BANK.find(function(x){return x.id===id});
  if(!q || q.opts.length >= 5) return;
  q.opts.push('Nueva opción');
  editQuestion(id);
}

function removeOpt(id, idx){
  var q = BANK.find(function(x){return x.id===id});
  if(!q || q.opts.length <= 2) return;
  q.opts.splice(idx, 1);
  if(q.a >= q.opts.length) q.a = 0;
  editQuestion(id);
}

// ── IMAGE ──
function previewImg(){
  var url = document.getElementById('edit-img').value.trim();
  var el = document.getElementById('img-preview-el');
  if(!el) return;
  if(url){
    el.outerHTML = '<img class="img-preview" id="img-preview-el" src="' + escHtml(url) + '" onerror="this.style.opacity=.3">';
  } else {
    el.outerHTML = '<div class="img-preview empty" id="img-preview-el">🖼️</div>';
  }
}

function clearImg(){
  document.getElementById('edit-img').value = '';
  previewImg();
}

// ── DELETE ──
function deleteQuestion(id){
  if(!confirm('¿Eliminar la pregunta #' + id + '? Esta acción no se puede deshacer.')) return;
  BANK = BANK.filter(function(q){return q.id!==id});
  currentId = null;
  document.getElementById('editor').innerHTML = '<div class="editor-empty"><div class="editor-empty-icon">🗑</div><div class="editor-empty-txt">Pregunta eliminada</div></div>';
  updateStats();
  renderList();
  showToast('Pregunta eliminada', true);
}

// ── ADD NEW ──
function showAddPanel(){
  newCorrectIdx = 0;
  setNewCorrect(0);
  document.querySelectorAll('#new-opts .opt-input').forEach(function(inp){ inp.value=''; });
  document.getElementById('new-q').value = '';
  document.getElementById('new-exp').value = '';
  document.getElementById('new-img').value = '';
  document.getElementById('addPanel').classList.add('show');
}
function closeAddPanel(){ document.getElementById('addPanel').classList.remove('show'); }

function setNewCorrect(idx){
  newCorrectIdx = idx;
  document.querySelectorAll('#new-opts .opt-letter').forEach(function(el, i){
    el.classList.toggle('correct', i===idx);
    el.closest('.opt-row').classList.toggle('correct-row', i===idx);
  });
}

function saveNewQuestion(){
  var q = document.getElementById('new-q').value.trim();
  var exp = document.getElementById('new-exp').value.trim();
  var cat = document.getElementById('new-cat').value;
  var img = document.getElementById('new-img').value.trim();
  var opts = [];
  document.querySelectorAll('#new-opts .opt-input').forEach(function(inp){ opts.push(inp.value.trim()); });
  
  if(!q || opts.some(function(o){return !o})){
    showToast('Completá la pregunta y todas las opciones', true); return;
  }
  
  var maxId = Math.max.apply(null, BANK.map(function(x){return x.id}));
  BANK.push({ id: maxId+1, cat: cat, img: img, q: q, opts: opts, a: newCorrectIdx, exp: exp });
  
  closeAddPanel();
  updateStats();
  buildFilterChips();
  renderList();
  editQuestion(maxId+1);
  showToast('✓ Pregunta #' + (maxId+1) + ' agregada');
}

// ── EXPORT ──
function exportBank(){
  var lines = BANK.map(function(q){
    var opts = q.opts.map(function(o){return '"'+o.replace(/"/g,'\"')+'"'}).join(',');
    var imgPart = q.img ? 'img:"'+q.img.replace(/"/g,'\"')+'",' : '';
    return '{cat:"'+q.cat.replace(/"/g,'\"')+'",'+imgPart+
      'q:"'+q.q.replace(/"/g,'\"')+'",'+
      'opts:['+opts+'],'+
      'a:'+q.a+','+
      'exp:"'+q.exp.replace(/"/g,'\"')+'"}';
  });
  var bankJs = 'var BANK=[\n' + lines.join(',\n') + '\n];';
  
  // Download as file — UTF-8 explicit
  var encoder = new TextEncoder();
  var bytes = encoder.encode(bankJs);
  var blob = new Blob([bytes], {type:'text/javascript;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bank_actualizado.js';
  a.click();
  showToast('✓ Banco exportado como bank_actualizado.js');
}

// ── UTILS ──
function escHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, isError){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(function(){t.style.display='none'}, 2500);
}

function getCatColor(cat){
  var colors = {
    'Señal de tránsito':'#0088C8','Normas de conducción':'#E89000',
    'Licencia de conducir':'#00c853','Alcohol y drogas':'#ff3b5c',
    'Elementos de seguridad':'#ff8c00','Responsabilidad vial':'#f50057',
    'Motovehículos':'#00bcd4','Transporte profesional':'#8bc34a',
    'Distancias de seguridad':'#ffd600','Estacionamiento':'#ff6d00',
    'Velocidades especificas':'#e040fb','Ciclistas y peatónes':'#76ff03',
    'Semáforos':'#ffab40','Documentacion':'#80cbc4'
  };
  return colors[cat] || '#8b91a8';
}


// ── THEME TOGGLE ──
function toggleTheme(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('bo-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('bo-theme', 'dark');
  }
  syncThemeToggleLabel();
}

function syncThemeToggleLabel(){
  var btn = document.getElementById('theme-toggle');
  if(!btn) return;
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.textContent = isDark ? '☀️ Modo claro' : '🌙 Modo oscuro';
}

// Load saved theme on start (default: light / fondo blanco)
(function(){
  var saved = localStorage.getItem('bo-theme') || 'light';
  if(saved === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  document.addEventListener('DOMContentLoaded', syncThemeToggleLabel);
})();

// ── START ──
document.addEventListener("DOMContentLoaded", init);

// ── SIGN PICKER ──
var _signPickerTarget = false; // false = edit mode, true = new question mode
var _selectedSignUrl = null;

function openSignPicker(isNew){
  _signPickerTarget = isNew;
  _selectedSignUrl = null;
  document.getElementById('signPickerConfirm').disabled = true;
  document.getElementById('signSearch').value = '';
  renderSignGrid(SIGNS_REPO);
  document.getElementById('signPickerModal').classList.add('show');
}

function closeSignPicker(){
  document.getElementById('signPickerModal').classList.remove('show');
}

function renderSignGrid(signs){
  var grid = document.getElementById('signGrid');
  grid.innerHTML = '';
  signs.forEach(function(url){
    var fname = url.split('/').pop();
    var div = document.createElement('div');
    div.className = 'sign-thumb';
    div.innerHTML = '<img src="' + url + '" loading="lazy" onerror="this.style.opacity=\'0.2\'">' +
      '<span class="sign-thumb-name">' + fname.replace('.png','') + '</span>';
    div.onclick = function(){
      document.querySelectorAll('.sign-thumb').forEach(function(t){t.classList.remove('selected')});
      div.classList.add('selected');
      _selectedSignUrl = url;
      document.getElementById('signPickerConfirm').disabled = false;
    };
    grid.appendChild(div);
  });
}

function filterSigns(){
  var q = document.getElementById('signSearch').value.toLowerCase();
  var filtered = SIGNS_REPO.filter(function(url){
    return !q || url.toLowerCase().includes(q);
  });
  renderSignGrid(filtered);
}

function confirmSignPicker(){
  if(!_selectedSignUrl) return;
  if(_signPickerTarget){
    // New question panel
    document.getElementById('new-img').value = _selectedSignUrl;
  } else {
    // Edit panel
    var el = document.getElementById('edit-img');
    if(el){
      el.value = _selectedSignUrl;
      previewImg();
    }
  }
  closeSignPicker();
  showToast('✓ Señal seleccionada');
}
